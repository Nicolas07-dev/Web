<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo - Formulário de Contato</title>
</head>
<body>

    <h1>Fale Conosco</h1>

    <form>
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" required placeholder="Digite seu nome">
        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" required placeholder="voce@email.com">
        <br><br>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" placeholder="Escreva aqui..."></textarea>
        <br><br>

        <button type="submit">Enviar mensagem</button>
    </form>

</body>
</html>
